# Railway 会读取本文件。若 Git 仓库是 YunMM 根目录（里面有 codes/），
# 请在服务 Settings 里把 Root Directory 设为 codes，
# Config-as-code 路径设为 /codes/railway.toml。

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
